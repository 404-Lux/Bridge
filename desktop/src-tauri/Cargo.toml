[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Bridge Desktop App (Windows Host)"
authors = ["Harra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
mdns-sd = "0.10"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
dirs-next = "2.0"
arboard = "3.3"
image = "0.24"
hostname = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
