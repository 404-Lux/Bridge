name: Bridge iOS ₱0 Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Free Tier)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate and Transform Xcode Project
        run: |
          cd ios
          echo "1. Generating Xcode project via XcodeGen..."
          xcodegen generate

          echo "2. Transforming generated project to Xcode 15 objectVersion 56..."
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' BridgeCompanion.xcodeproj/project.pbxproj

          echo "3. Verifying objectVersion 56 transformation..."
          if ! grep -q 'objectVersion = 56;' BridgeCompanion.xcodeproj/project.pbxproj; then
            echo "ERROR: objectVersion 56 check failed."
            exit 1
          fi

          echo "4. Verifying objectVersion 77 is absent..."
          if grep -q 'objectVersion = 77;' BridgeCompanion.xcodeproj/project.pbxproj; then
            echo "ERROR: Xcode 16 objectVersion 77 is still present."
            exit 1
          fi

          echo "5. Verifying Xcode 15.4 project parsing..."
          DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer \
          xcodebuild -list -project BridgeCompanion.xcodeproj

      - name: Archive Unsigned Physical Device Xcode Project (iphoneos)
        run: |
          cd ios
          xcodebuild archive \
            -project BridgeCompanion.xcodeproj \
            -scheme BridgeCompanion \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/BridgeCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa Binary
        run: |
          cd ios
          mkdir -p Payload
          cp -r ./build/BridgeCompanion.xcarchive/Products/Applications/BridgeCompanion.app ./Payload/
          zip -r BridgeCompanion.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeCompanion-unsigned-ipa
          path: ios/BridgeCompanion.ipa
