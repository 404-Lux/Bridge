name: Bridge iOS ₱0 Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Free Tier)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd ios
          export DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer

          echo "Developer directory:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

          echo "XcodeGen version:"
          xcodegen --version

          echo "Generating project..."
          xcodegen generate

          echo "Checking generated project format..."
          grep "objectVersion" BridgeCompanion.xcodeproj/project.pbxproj | head -1

          echo "Verifying project format..."

          if grep -q "objectVersion = 56;" BridgeCompanion.xcodeproj/project.pbxproj; then
            echo "SUCCESS: Xcode 15-compatible objectVersion 56 generated."
          else
            echo "ERROR: Generated project is NOT objectVersion 56."
            grep "objectVersion" BridgeCompanion.xcodeproj/project.pbxproj | head -1
            exit 1
          fi

      - name: Archive Unsigned Physical Device Xcode Project (iphoneos)
        run: |
          cd ios
          xcodebuild archive \
            -project BridgeCompanion.xcodeproj \
            -scheme BridgeCompanion \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/BridgeCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa Binary
        run: |
          cd ios
          mkdir -p Payload
          cp -r ./build/BridgeCompanion.xcarchive/Products/Applications/BridgeCompanion.app ./Payload/
          zip -r BridgeCompanion.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeCompanion-unsigned-ipa
          path: ios/BridgeCompanion.ipa
