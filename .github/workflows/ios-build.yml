name: Bridge iOS ₱0 Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Free Tier)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: XcodeGen 2.45.4 Format Diagnostic Matrix
        run: |
          cd ios
          export DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer

          echo "=== XcodeGen & Xcode Info ==="
          xcode-select -p
          xcodebuild -version
          xcodegen --version

          echo "=== TEST A: objectVersion: 56 in options ==="
          cat << 'EOF' > test_a.yml
          name: TestA
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 16.0
            objectVersion: 56
          targets:
            TestA:
              type: application
              platform: iOS
              sources:
                - path: BridgeCompanion
          EOF
          xcodegen generate --spec test_a.yml
          echo "Test A objectVersion:"
          grep "objectVersion" TestA.xcodeproj/project.pbxproj | head -1
          rm -rf TestA.xcodeproj test_a.yml

          echo "=== TEST B: objectVersion: 56 + minimumXcodeVersion: 15.0 ==="
          cat << 'EOF' > test_b.yml
          name: TestB
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 16.0
            objectVersion: 56
            minimumXcodeVersion: "15.0"
          targets:
            TestB:
              type: application
              platform: iOS
              sources:
                - path: BridgeCompanion
          EOF
          xcodegen generate --spec test_b.yml
          echo "Test B objectVersion:"
          grep "objectVersion" TestB.xcodeproj/project.pbxproj | head -1
          rm -rf TestB.xcodeproj test_b.yml

          echo "=== TEST C: objectVersion transformation & Xcode 15.4 reading test ==="
          cat << 'EOF' > test_c.yml
          name: TestC
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 16.0
          targets:
            TestC:
              type: application
              platform: iOS
              sources:
                - path: BridgeCompanion
          EOF
          xcodegen generate --spec test_c.yml
          echo "Test C original objectVersion:"
          grep "objectVersion" TestC.xcodeproj/project.pbxproj | head -1

          echo "Transforming TestC project file to objectVersion = 56..."
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TestC.xcodeproj/project.pbxproj
          echo "Test C transformed objectVersion:"
          grep "objectVersion" TestC.xcodeproj/project.pbxproj | head -1

          echo "Testing if Xcode 15.4 xcodebuild can read transformed project TestC:"
          xcodebuild -list -project TestC.xcodeproj
          rm -rf TestC.xcodeproj test_c.yml

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd ios
          export DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer
          xcodegen generate

          echo "Checking generated project format..."
          grep "objectVersion" BridgeCompanion.xcodeproj/project.pbxproj | head -1

          if grep -q "objectVersion = 56;" BridgeCompanion.xcodeproj/project.pbxproj; then
            echo "SUCCESS: Xcode 15-compatible objectVersion 56 generated."
          else
            echo "ERROR: Generated project is NOT objectVersion 56."
            grep "objectVersion" BridgeCompanion.xcodeproj/project.pbxproj | head -1
            exit 1
          fi

      - name: Archive Unsigned Physical Device Xcode Project (iphoneos)
        run: |
          cd ios
          xcodebuild archive \
            -project BridgeCompanion.xcodeproj \
            -scheme BridgeCompanion \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/BridgeCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa Binary
        run: |
          cd ios
          mkdir -p Payload
          cp -r ./build/BridgeCompanion.xcarchive/Products/Applications/BridgeCompanion.app ./Payload/
          zip -r BridgeCompanion.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeCompanion-unsigned-ipa
          path: ios/BridgeCompanion.ipa
